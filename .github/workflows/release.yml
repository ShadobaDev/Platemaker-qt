# Release pipeline for the GUI: on a bare version tag (e.g. 1.4.3), build the Windows installer, attach a
# build-provenance attestation, and upload the installer + its SHA256SUMS to a GitHub Release.
#
# MSVC-only. The app is built with MSVC 2022 (not MinGW): a MinGW-compiled, unsigned build trips a Defender
# ML false positive (Wacatac.B!ml) on both libplatemaker.dll and the installer; the MSVC build is clean.
# Because Qt 6.11 supports MSVC 2022 and windows-latest has moved to the VS 2026 image, the job runs on
# windows-2022 (which ships VS 2022). It depends on the LIB: CMake downloads
# `platemaker-dev-<LIBPLATEMAKER_VERSION>-windows-msvc-release.zip` from the lib's GitHub Release, so that
# lib version's MSVC dev asset must exist (0.5.1+ publishes it; 0.5.0 was MinGW-only).
#
# Add a `VT_API_KEY` repo secret (this repo, separately from the lib) to enable the VirusTotal step.
name: Release

on:
  push:
    tags: ['*.*.*']          # bare versions: 1.4.3
  workflow_dispatch:         # manual build validation (no Release — the publish/VT steps are tag-only)

permissions:
  contents: write            # create the Release + upload assets
  id-token: write            # OIDC for provenance
  attestations: write        # store the provenance attestation

jobs:
  installer:
    runs-on: windows-2022    # VS 2022 — matches Qt 6.11's MSVC 2022 support and the lib's MSVC package
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Qt (win64_msvc2022_64). aqtinstall is driven from git master because aqt 3.3.0 does not yet handle
      # Qt 6.11's online-repo layout (miurahr/aqtinstall#1007). The MSVC compiler comes from the runner's
      # VS 2022 (activated by msvc-dev-cmd below); Qt does not ship a compiler for MSVC.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install aqtinstall (git master — has the Qt 6.11 repo-layout fix, #1007)
        shell: pwsh
        run: python -m pip install --upgrade "git+https://github.com/miurahr/aqtinstall.git"

      - name: Install Qt 6.11.2 (MSVC 2022)
        shell: pwsh
        run: python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 --outputdir "${{ github.workspace }}\Qt"

      # Put cl.exe + the VS 2022 x64 environment on PATH for the Ninja build.
      - name: Set up MSVC 2022 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set Qt environment
        shell: pwsh
        run: |
          $qt = "${{ github.workspace }}\Qt\6.11.2\msvc2022_64"
          if (-not (Test-Path "$qt\bin\qmake.exe")) { throw "Qt not found at $qt" }
          Write-Host "Qt: $qt"
          # CMAKE_PREFIX_PATH lets find_package(Qt6) resolve; $qt\bin gives windeployqt/moc/uic.
          "CMAKE_PREFIX_PATH=$qt" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
          "$qt\bin"               | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Ninja + Inno Setup
        shell: pwsh
        run: choco install ninja innosetup --no-progress -y

      # Configure (downloads the MSVC libplatemaker dev package from its Release) + build the Inno Setup
      # installer, which also writes installer-output/Platemaker-<ver>-SHA256SUMS.txt. Single-config Ninja
      # needs an explicit build type.
      - name: Configure & build installer
        shell: pwsh
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target installer

      # Expose the installer (+ checksum) as a run artifact so it's downloadable from any run — including a
      # workflow_dispatch validation build, which doesn't publish a Release.
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            installer-output/Platemaker-*-Setup.exe
            installer-output/Platemaker-*-SHA256SUMS.txt
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: installer-output/Platemaker-*-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            installer-output/Platemaker-*-Setup.exe
            installer-output/Platemaker-*-SHA256SUMS.txt

      # Best-effort malware scan; appends the VirusTotal link to the release body. Self-skips without the
      # secret, and never fails the release.
      - name: Scan installer on VirusTotal
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.VT_API_KEY != '' }}
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ github.token }}
          update_release_body: true
          files: installer-output/Platemaker-*-Setup.exe
